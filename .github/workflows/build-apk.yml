name: Build UniGrab Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build UniGrab APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
        working-directory: UniGrabApp

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: UniGrabApp

      - name: Rename APK for Release
        run: |
          mkdir -p release-output
          cp UniGrabApp/app/build/outputs/apk/debug/*.apk release-output/UniGrab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniGrab-APK
          path: release-output/UniGrab.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('UniGrab {0}', github.ref_name) || 'UniGrab v1.0.0 (Release)' }}
          generate_release_notes: true
          body: |
            ### UniGrab for Android 🚀
            
            Download and install **`UniGrab.apk`** directly on your Android device!
            
            #### ✨ Highlights:
            - **100% Client-Side & Private**: Runs directly on your device, zero cloud servers, zero trackers or ads.
            - **Aria2c Multi-Threading**: Multi-segmented concurrent chunk downloading for maximum speed.
            - **Lossless Audio & 4K/8K Video**: High-res album covers, ID3 metadata tags, and subtitle downloads.
            - **1,800+ Supported Sites**: YouTube (4K/Shorts), Spotify, Instagram Reels, TikTok, Twitter/X, SoundCloud, Archive.org, and direct HLS/M3U8 streams.
            - **Task Queue & Logs**: Real-time progress with instant pause/resume and live console output.
            - **Offline Media Library**: Saves directly to device storage, playable with any local media player (VLC, MX Player).
            - **1-Tap Engine Updater**: Update yt-dlp core on-device with one tap.
            
            #### 📱 Fast Install via Obtainium:
            Add `https://github.com/mksh2810/UniGrab` to [Obtainium](https://github.com/ImranR98/Obtainium) for 1-tap installation and automatic background updates!
          files: release-output/UniGrab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
